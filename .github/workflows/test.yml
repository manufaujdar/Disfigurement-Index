name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m py_compile server.py tests/test_algorithm.py tests/test_frontend_agent.py tools/frontend_agent/frontend_agent.py
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
      - name: Check browser-local persistence contracts
        run: node tests/display-settings.test.cjs
      - name: Run frontend review agent
        run: python tools/frontend_agent/frontend_agent.py audit --json

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
      - run: npm ci --prefix tools/browser-tests --ignore-scripts
      - run: npm audit --prefix tools/browser-tests --audit-level=high
      - run: tools/browser-tests/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/browser_regressions.cjs
