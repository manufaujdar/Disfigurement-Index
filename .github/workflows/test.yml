name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m py_compile server.py tests/test_algorithm.py tests/test_frontend_agent.py tools/frontend_agent/frontend_agent.py
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
      - name: Run frontend review agent
        run: python tools/frontend_agent/frontend_agent.py audit --json
